name: Build

on:
  workflow_dispatch:
    inputs:
        Alpha:
          description: 'Alpha'
          required: true
          default: 'true'
        Premium:
          description: 'Premium'
          required: true
          default: 'false'
        Foss:
          description: 'Foss'
          required: true
          default: 'false'

jobs:
  build:
    name: "Build APKs"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    permissions:
      contents: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup gradle
        uses: gradle/gradle-build-action@v2

      - name: Setup gradlew
        run: chmod +x gradlew

      - name: Check build-logic
        run: ./gradlew check -p build-logic

      - name: Decode store file
        env:
            STORE_FILE: ${{ secrets.STORE_FILE }}
            ENCODED_STRING: ${{ secrets.STORE_BASE64 }}
        run: |
          if [ -z "${STORE_FILE}" ] || [ -z "${ENCODED_STRING}" ]; then
            echo "Error: STORE_FILE or ENCODED_STRING is empty"
            exit 1
          fi
          mkdir -p app
          echo "${ENCODED_STRING}" | base64 -di > "app/${STORE_FILE}"
          if [ ! -f "app/${STORE_FILE}" ]; then
            echo "Error: Failed to create keystore file"
            exit 1
          fi
          echo "Keystore file created successfully"

      - name: Build with gradle
        id: gradle
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_ALPHA: ${{ github.event.inputs.Alpha }}
          BUILD_PREMIUM: ${{ github.event.inputs.Premium }}
          BUILD_FOSS: ${{ github.event.inputs.Foss }}
        run: |
          TASKS=""
          if [ "${BUILD_ALPHA}" = 'true' ]; then
            TASKS="$TASKS assembleArm64-v8aAlphaRelease assembleArmeabi-v7aAlphaRelease assembleX86AlphaRelease assembleX86_64AlphaRelease"
          fi
          if [ "${BUILD_PREMIUM}" = 'true' ]; then
            TASKS="$TASKS assembleArm64-v8aPremiumRelease assembleArmeabi-v7aPremiumRelease assembleX86PremiumRelease assembleX86_64PremiumRelease"
          fi
          if [ "${BUILD_FOSS}" = 'true' ]; then
            TASKS="$TASKS assembleArm64-v8aFossRelease assembleArmeabi-v7aFossRelease assembleX86FossRelease assembleX86_64FossRelease"
          fi
          if [ -z "${TASKS}" ]; then
            TASKS="assembleRelease"
          fi
          echo "Running tasks: ${TASKS}"
          ./gradlew ${TASKS} --daemon --parallel

      - name: Move APKs
        run: |
          mkdir -p apks
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} apks/ \;
          echo "Found APK files:"
          ls -la apks/

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: 'apks/*.apk'
          retention-days: 30

      - name: Generate Release Tag
        id: release
        run: |
          RELEASE_DATE=$(date +'%Y%m%d-%H%M')
          RELEASE_TAG="build-${RELEASE_DATE}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated release tag: ${RELEASE_TAG}"

      - name: Create Release and Upload APKs
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release.outputs.release_tag }}
          name: "Build ${{ steps.release.outputs.release_tag }}"
          body: |
            ## Android DataBackup
            
            ### Build information:
            - **Date**: $(date +'%Y-%m-%d %H:%M:%S')
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            
            ### APK files:
            - **Alpha**: Testing version
            - **Premium**: Full featured version
            - **FOSS**: Free and open source version
            
            ### Architectures:
            - arm64-v8a (modern devices)
            - armeabi-v7a (older devices)
            - x86 (emulators)
            - x86_64 (emulators)
          artifacts: 'source/apks/*.apk'
          artifactContentType: application/vnd.android.package-archive
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
